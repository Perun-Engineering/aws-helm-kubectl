name: Version Check

on:
  schedule:
    # Check for new versions every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for new versions
        id: version-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for new versions..."

          # Function to get latest GitHub release
          get_latest_release() {
            curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$1/releases/latest" | jq -r '.tag_name' | sed 's/^v//'
          }

          # Function to get latest tag (for repos without GitHub Releases, e.g. aws-cli)
          get_latest_tag() {
            curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$1/tags?per_page=100" | \
            jq -r '.[].name' | sed 's/^v//' | \
            grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1
          }

          # Function to get latest Alpine version
          get_latest_alpine() {
            curl -s "https://registry.hub.docker.com/v2/repositories/library/alpine/tags/?page_size=100" | \
            jq -r '.results[].name' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1
          }

          # Function to get latest Kubernetes version
          get_latest_kubernetes() {
            curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/kubernetes/kubernetes/releases/latest" | jq -r '.tag_name' | sed 's/^v//'
          }

          # Function to get the latest python builder image on the current tracks.
          # Stays on the Python minor we already build against (a Python major/minor
          # jump needs an aws-cli compatibility check, not an automated nudge) and
          # follows whichever Alpine minor ALPINE_VERSION is on, so the two move together.
          get_latest_python_alpine() {
            local py_minor alpine_track
            py_minor=$(echo "$ALPINE_PYTHON" | cut -d. -f1-2)
            alpine_track=alpine$(echo "$ALPINE_VERSION" | cut -d. -f1-2)
            curl -s "https://registry.hub.docker.com/v2/repositories/library/python/tags/?name=-${alpine_track}&page_size=100" | \
            jq -r '.results[].name' | \
            grep -E "^${py_minor}\.[0-9]+-${alpine_track}$" | sort -V | tail -1
          }

          # Function to get the latest patch release of a given Kubernetes minor (e.g. 1.36)
          get_latest_kubernetes_patch() {
            local stable
            stable=$(curl -fsS "https://dl.k8s.io/release/stable-$1.txt" 2>/dev/null) || return 0
            echo "$stable" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//'
          }

          # Read current versions
          source .env

          # Check versions
          LATEST_ALPINE=$(get_latest_alpine)
          LATEST_HELM=$(get_latest_release "helm/helm")
          LATEST_KUBERNETES=$(get_latest_kubernetes)
          LATEST_SOPS=$(get_latest_release "getsops/sops")
          LATEST_HELM_SECRETS=$(get_latest_release "jkroepke/helm-secrets")
          LATEST_HELMFILE=$(get_latest_release "helmfile/helmfile")
          LATEST_HELM_DIFF=$(get_latest_release "databus23/helm-diff")
          LATEST_AWS_CLI=$(get_latest_tag "aws/aws-cli")
          LATEST_HELM_S3=$(get_latest_release "hypnoglow/helm-s3")
          LATEST_ALPINE_PYTHON=$(get_latest_python_alpine)

          echo "Current versions:"
          echo "Alpine: $ALPINE_VERSION"
          echo "Python builder: $ALPINE_PYTHON"
          echo "Helm: $HELM_VERSION"
          echo "SOPS: $SOPS_VERSION"
          echo "Helm Secrets: $HELM_SECRETS_VERSION"
          echo "Helmfile: $HELMFILE_VERSION"
          echo "Helm Diff: $HELM_DIFF_VERSION"
          echo "AWS CLI: $AWS_CLI_VERSION"
          echo "Helm S3: $HELM_S3_VERSION"

          echo "Latest versions:"
          echo "Alpine: $LATEST_ALPINE"
          echo "Python builder: $LATEST_ALPINE_PYTHON"
          echo "Helm: $LATEST_HELM"
          echo "Kubernetes: $LATEST_KUBERNETES"
          echo "SOPS: $LATEST_SOPS"
          echo "Helm Secrets: $LATEST_HELM_SECRETS"
          echo "Helmfile: $LATEST_HELMFILE"
          echo "Helm Diff: $LATEST_HELM_DIFF"
          echo "AWS CLI: $LATEST_AWS_CLI"
          echo "Helm S3: $LATEST_HELM_S3"

          # Check if updates are needed
          UPDATES_NEEDED=""

          if [ "$ALPINE_VERSION" != "$LATEST_ALPINE" ]; then
            UPDATES_NEEDED="$UPDATES_NEEDED\n- Alpine: $ALPINE_VERSION → $LATEST_ALPINE"
          fi

          # Empty means the lookup failed or no image exists on this track yet;
          # stay quiet rather than emitting a half-written "x → " line.
          if [ -n "$LATEST_ALPINE_PYTHON" ] && [ "$ALPINE_PYTHON" != "$LATEST_ALPINE_PYTHON" ]; then
            UPDATES_NEEDED="$UPDATES_NEEDED\n- Python builder: $ALPINE_PYTHON → $LATEST_ALPINE_PYTHON"
          fi

          if [ "$HELM_VERSION" != "$LATEST_HELM" ]; then
            UPDATES_NEEDED="$UPDATES_NEEDED\n- Helm: $HELM_VERSION → $LATEST_HELM"
          fi

          if [ "$SOPS_VERSION" != "$LATEST_SOPS" ]; then
            UPDATES_NEEDED="$UPDATES_NEEDED\n- SOPS: $SOPS_VERSION → $LATEST_SOPS"
          fi

          if [ "$HELM_SECRETS_VERSION" != "$LATEST_HELM_SECRETS" ]; then
            UPDATES_NEEDED="$UPDATES_NEEDED\n- Helm Secrets: $HELM_SECRETS_VERSION → $LATEST_HELM_SECRETS"
          fi

          if [ "$HELMFILE_VERSION" != "$LATEST_HELMFILE" ]; then
            UPDATES_NEEDED="$UPDATES_NEEDED\n- Helmfile: $HELMFILE_VERSION → $LATEST_HELMFILE"
          fi

          if [ "$HELM_DIFF_VERSION" != "$LATEST_HELM_DIFF" ]; then
            UPDATES_NEEDED="$UPDATES_NEEDED\n- Helm Diff: $HELM_DIFF_VERSION → $LATEST_HELM_DIFF"
          fi

          if [ "$AWS_CLI_VERSION" != "$LATEST_AWS_CLI" ]; then
            UPDATES_NEEDED="$UPDATES_NEEDED\n- AWS CLI: $AWS_CLI_VERSION → $LATEST_AWS_CLI"
          fi

          if [ "$HELM_S3_VERSION" != "$LATEST_HELM_S3" ]; then
            UPDATES_NEEDED="$UPDATES_NEEDED\n- Helm S3: $HELM_S3_VERSION → $LATEST_HELM_S3"
          fi

          # Read the raw line rather than the sourced value: `source .env` strips
          # the JSON quotes, leaving [1.33.13,...] which jq rejects. The list was
          # therefore always empty, so the "add a new minor" check below never
          # matched and reported every latest release as missing.
          KUBERNETES_VERSIONS_JSON=$(grep '^KUBERNETES_VERSIONS=' .env | cut -d'=' -f2-)
          CURRENT_KUBE_VERSIONS=$(echo "$KUBERNETES_VERSIONS_JSON" | jq -r '.[]' | sort -V)

          # Check each tracked minor for a newer patch. The "add a new minor" check
          # below only fires when a whole new minor appears, so without this a patch
          # bump inside a minor we already ship (1.36.2 → 1.36.4) goes unreported.
          while read -r kube_version; do
            [ -n "$kube_version" ] || continue
            kube_minor=$(echo "$kube_version" | cut -d. -f1-2)
            latest_patch=$(get_latest_kubernetes_patch "$kube_minor")
            echo "Kubernetes $kube_minor: $kube_version (latest patch: ${latest_patch:-unknown})"
            if [ -n "$latest_patch" ] && [ "$kube_version" != "$latest_patch" ]; then
              UPDATES_NEEDED="$UPDATES_NEEDED\n- Kubernetes: $kube_version → $latest_patch"
            fi
          done <<< "$CURRENT_KUBE_VERSIONS"

          # Check if a brand new Kubernetes minor should be added to the matrix
          LATEST_KUBE_MAJOR_MINOR=$(echo $LATEST_KUBERNETES | cut -d. -f1-2)

          if ! echo "$CURRENT_KUBE_VERSIONS" | grep -q "^$LATEST_KUBE_MAJOR_MINOR"; then
            UPDATES_NEEDED="$UPDATES_NEEDED\n- Kubernetes: Add version $LATEST_KUBERNETES"
          fi

          # Check pre-commit hook revisions. Running the tool's own updater beats
          # parsing the config by hand: it skips `repo: local`, and it understands
          # repos that tag without cutting GitHub releases.
          if pip install --quiet pre-commit; then
            pre-commit autoupdate >/dev/null 2>&1 || true
            while read -r old_rev new_rev; do
              UPDATES_NEEDED="$UPDATES_NEEDED\n- pre-commit hooks: $old_rev → $new_rev"
            done < <(git diff -U0 -- .pre-commit-config.yaml | \
                     awk '/^[-+][[:space:]]*rev:/ {print $NF}' | paste - -)
            git checkout -- .pre-commit-config.yaml
          else
            echo "::warning::Could not install pre-commit; skipped the hook revision check."
          fi

          if [ -n "$UPDATES_NEEDED" ]; then
            echo "updates_needed=true" >> $GITHUB_OUTPUT
            echo "updates_list<<EOF" >> $GITHUB_OUTPUT
            echo -e "$UPDATES_NEEDED" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "updates_needed=false" >> $GITHUB_OUTPUT
            echo "All versions are up to date!"
          fi

      - name: Create Issue for Version Updates
        if: steps.version-check.outputs.updates_needed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const title = `🔄 Version Updates Available - ${new Date().toISOString().split('T')[0]}`;
            const body = `## Version Updates Available

            The following components have new versions available:

            ${{ steps.version-check.outputs.updates_list }}

            ## Action Required

            Please review and update the versions in the \`.env\` file, then test the changes.

            ## Automated Check

            This issue was created automatically by the version check workflow.

            ---

            **Workflow:** \`${{ github.workflow }}\`
            **Run ID:** \`${{ github.run_id }}\`
            **Triggered:** \`${{ github.event_name }}\``;

            // Check if there's already an open issue for version updates
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'version-update'
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.includes('Version Updates Available')
            );

            if (existingIssue) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                title: title,
                body: body
              });
              console.log(`Updated existing issue #${existingIssue.number}`);
            } else {
              // Create new issue
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['version-update', 'enhancement']
              });
              console.log(`Created new issue #${issue.data.number}`);
            }
